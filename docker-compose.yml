# Main Responsibility: Local multi-container setup (Postgres + OCR sidecar + backend).
# Postgres mounts ./db/migrations into docker-entrypoint-initdb.d (runs on first start only).
# OCR is internal-only (no host port). Backend waits for Postgres + OCR healthy before starting.

services:
  postgres:
    image: postgres:16
    container_name: finance_tracker_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Persist DB data across container restarts.
      - postgres_data:/var/lib/postgresql/data
      # Read-only: SQL files run once when the data volume is empty.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ocr:
    build: ./ocr
    container_name: finance_tracker_ocr
    # No ports: section — reachable only on the Compose network as http://ocr:8080.
    healthcheck:
      # Models load at startup; fail until /health returns 200.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  backend:
    build: ./backend
    container_name: finance_tracker_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_DIR: ${UPLOAD_DIR}
      OCR_BASE_URL: ${OCR_BASE_URL:-http://ocr:8080}
    volumes:
      # Persist uploaded files across backend container restarts.
      - uploads_data:${UPLOAD_DIR}
    depends_on:
      postgres:
        condition: service_healthy
      ocr:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
