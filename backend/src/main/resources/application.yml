# Main Responsibility: Spring Boot runtime settings (DB, server port, JWT, OCR, Groq LLM).
# Secrets and host-specific values come from environment variables / .env.

spring:
  datasource:
    # JDBC URL, user, and password are injected at runtime (see docker-compose / .env).
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      # Schema is owned by SQL migrations in db/migrations — do not let Hibernate change it.
      ddl-auto: none
    # Avoid lazy DB access outside a transaction after the request controller returns.
    open-in-view: false
  servlet:
    multipart:
      # Keep upload requests aligned with the Step 9 limit.
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  tomcat:
    # Sync OCR (~30s) + Groq (~20s) can keep POST /documents open for ~60s;
    # 120s leaves headroom for slow photos without hanging forever.
    connection-timeout: 120s

app:
  jwt:
    secret: ${JWT_SECRET}
    # 86400000 ms = 24 hours token lifetime.
    expiration-ms: 86400000
  upload:
    # Base folder for local document uploads. Docker/.env provides the real path.
    dir: ${UPLOAD_DIR}
  ocr:
    # RapidOCR sidecar base URL (Compose: http://ocr:8080). Empty → HttpOcrClient bean off.
    base-url: ${OCR_BASE_URL:}
    # Read timeout for POST /ocr (~30s per the extraction plan).
    timeout-ms: ${OCR_TIMEOUT_MS:30000}
  groq:
    # Groq Cloud chat API (OpenAI-compatible path). Empty key → GroqReceiptParser bean off.
    api-key: ${GROQ_API_KEY:}
    api-base-url: ${GROQ_API_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    # Read timeout for chat completions (~20s per the extraction plan).
    timeout-ms: ${GROQ_TIMEOUT_MS:20000}
